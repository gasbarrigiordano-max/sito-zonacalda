<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zonacalda — guest list</title>
<meta name="description" content="zonacalda. guest list. richiedi il tuo accesso ed attendi il tuo invito personale al nostro party.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../assets/zonacalda-diavolo-linee.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta property="og:title" content="Zonacalda — guest list">
<meta property="og:description" content="richiedi il tuo accesso ed attendi il tuo invito personale. 😈">
<meta property="og:image" content="https://zonacaldaclubuse.it/assets/og-zonacalda.png">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../pagine.css">
<style>
  /* logo a due righe: intero e proporzionato, su telefono e computer */
  .testa-2righe { padding-top: calc(.75rem + env(safe-area-inset-top)); }
  .testa-2righe a { width: min(78vw, 360px); margin: 0 auto -2.2rem; }
</style>
<script src="../js/api.js" defer></script>
<script src="lista.js" defer></script>
</head>
<body>
<header class="testa testa-2righe"><a href="../"><img src="../assets/zonacalda-logo-2righe-sito.svg" width="1090" height="770" alt="ZONA CALDA, club use: insegna neon rossa"></a></header>

<main class="pagina">
  <h1>guest list</h1>
  <p class="sotto">richiedi il tuo accesso ed attendi il tuo invito personale al nostro party.</p>

  <form id="modulo" novalidate>
    <label>nome
      <input type="text" name="nome" autocomplete="given-name" autocapitalize="words" maxlength="60" required>
    </label>
    <label>cognome
      <input type="text" name="cognome" autocomplete="family-name" autocapitalize="words" maxlength="60" required>
    </label>
    <label>data di nascita <span class="facoltativo">(verrà richiesto il documento all'entrata)</span>
      <input type="date" name="nascita" autocomplete="bday" min="1926-01-01" max="2010-12-31" required>
    </label>
    <label>email
      <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" maxlength="120" required>
    </label>
    <label>telefono
      <input type="tel" name="telefono" autocomplete="tel" inputmode="tel" placeholder="+39 …" maxlength="20" required>
    </label>
    <label>instagram <span class="facoltativo">(facoltativo)</span>
      <input type="text" name="instagram" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="@" maxlength="40">
    </label>
    <div class="trappola" aria-hidden="true">
      <label>sito <input type="text" name="sito" tabindex="-1" autocomplete="off"></label>
    </div>

    <label class="spunta"><input type="checkbox" name="informativa" required>
      <span>ho letto l'<a href="../privacy/" target="_blank" rel="noopener">informativa privacy</a> e ho almeno 23 anni.</span>
    </label>
    <label class="spunta"><input type="checkbox" name="prossime">
      <span>avvisatemi anche per le prossime serate. <span class="facoltativo">(facoltativo)</span></span>
    </label>

    <p class="errore" id="errore" role="alert"></p>
    <button class="bottone" type="submit" id="invia">richiedi accesso.</button>
  </form>

  <div class="esito" id="esito" hidden aria-live="polite">
    <p class="grande" id="esito-titolo"></p>
    <p id="esito-testo"></p>
  </div>

  <p class="nota">23+. invito personale. <a href="../privacy/">privacy.</a></p>
</main>
</body>
</html>
