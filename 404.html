<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zonacalda — niente</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/assets/zonacalda-diavolo-linee.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  html { background: #050505; color: #f0eded; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
  img { width: 120px; height: 120px; filter: drop-shadow(0 0 2px #ff3a46) drop-shadow(0 0 8px #ff1424) drop-shadow(0 0 22px rgba(255,20,36,.65)); }
  p { font-size: 1.5rem; font-weight: 600; margin: 1.5rem 0 1rem; }
  a { color: #9b9696; }
  a:hover, a:focus-visible { color: #ff2634; }
</style>
<!-- visite anonime (GoatCounter, senza cookie): manda solo la pagina, mai i codici dopo il "?" -->
<script>if (!/^(localhost|127\.)/.test(location.hostname)) addEventListener('load', function () { var r = (document.referrer || '').split(/[?#]/)[0]; new Image().src = 'https://zonacalda.goatcounter.com/count?p=' + encodeURIComponent(location.pathname) + '&r=' + encodeURIComponent(r) + '&s=' + screen.width + '&rnd=' + Math.random(); });</script>
</head>
<body>
<main>
  <img src="/assets/zonacalda-diavolo-linee.svg" alt="">
  <p>qui non c'è niente. 😈</p>
  <a href="/">torna al caldo.</a>
</main>
</body>
</html>
