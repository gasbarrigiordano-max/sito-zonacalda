# Pubblica il sito su GitHub Pages a ogni push su main.
# In Settings → Pages la sorgente deve essere "GitHub Actions".
name: pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del sito (senza strumenti e automazioni)
        run: |
          mkdir _site
          cp index.html 404.html style.css pagine.css main.js _site/
          cp -r assets js vendor lista invito porta privacy _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
