# Pubblica il sito su GitHub Pages a ogni push su main.
# In Settings → Pages la sorgente deve essere "GitHub Actions".
#
# Due lavori separati (come nel modello di GitHub): "prepara" crea e carica il pacchetto del sito, "pubblica" lo mette online.
# Prima era tutto in un lavoro solo e, a volte, la pubblicazione non trovava il pacchetto appena caricato ("0 artifact").
# La pubblicazione, se non riesce, riprova da sola due volte prima di dare errore.
name: pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del sito (senza strumenti e automazioni)
        run: |
          mkdir _site
          cp index.html 404.html style.css pagine.css main.js apple-touch-icon.png favicon.ico _site/
          cp -r assets js vendor lista invito porta privacy staff backstage regia _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: prepara
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.finale.outputs.page_url || steps.secondo.outputs.page_url || steps.primo.outputs.page_url }}
    steps:
      - name: Pubblica (tentativo 1)
        id: primo
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attesa prima di riprovare
        if: steps.primo.outcome == 'failure'
        run: sleep 40
      - name: Pubblica (tentativo 2)
        id: secondo
        if: steps.primo.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attesa prima di riprovare
        if: steps.primo.outcome == 'failure' && steps.secondo.outcome == 'failure'
        run: sleep 90
      - name: Pubblica (tentativo 3)
        id: finale
        if: steps.primo.outcome == 'failure' && steps.secondo.outcome == 'failure'
        uses: actions/deploy-pages@v4
